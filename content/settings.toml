# ENTROPY settings. Any key left out keeps its default (src/entropy/core/config.py).

[window]
width_px = 1600
height_px = 900
title = "ENTROPY"
vsync = true
gl_version = [4, 6]

[camera]
fov_y_deg = 70.0
speed_m_per_s = 5.0                  # free flight, metres per second
mouse_rad_per_px = 0.0025            # look sensitivity, radians per mouse count
start_position_m = [8.0, -9.0, 4.0]  # all five cubes in view, lit and shaded faces
start_yaw_deg = 130.0                # from +X towards +Y
start_pitch_deg = -15.0              # negative looks down

[controls]
# Une lettre ou un chiffre = la touche qui porte ce signe sur TON clavier (ici AZERTY).
# Les autres touches par leur nom : SPACE, LEFT_CONTROL, RIGHT_SHIFT, F3, ESCAPE, PAGE_UP...
# Plusieurs touches pour une action : séparées par des virgules.
forward = "Z"
back = "S"
left = "Q"
right = "D"
up = "SPACE"
down = "LEFT_CONTROL, RIGHT_CONTROL"
toggle_hud = "F3"
menu = "ESCAPE"
