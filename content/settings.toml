# ENTROPY settings. Any key left out keeps its default (src/entropy/core/config.py).

[window]
width_px = 1600
height_px = 900
title = "ENTROPY"
vsync = true
gl_version = [4, 6]

[camera]
fov_y_deg = 70.0
speed_m_per_s = 5.0                  # free flight, metres per second
mouse_rad_per_px = 0.0025            # look sensitivity, radians per mouse count
start_position_m = [4.6, -5.4, 3.0]  # the Test Tank in view, from a corner
start_yaw_deg = 130.0                # from +X towards +Y
start_pitch_deg = -24.0              # negative looks down

[controls]
# Une lettre = la touche qui porte cette lettre sur TON clavier (ici AZERTY).
# Un chiffre = la touche de ce chiffre sur la rangée du haut.
# Les autres touches par leur nom : SPACE, LEFT_CONTROL, RIGHT_SHIFT, F3, ESCAPE, PAGE_UP...
# Plusieurs touches pour une action : séparées par des virgules.
# Si une touche est mal écrite, le jeu le dit au démarrage dans une fenêtre d'erreur.
forward = "Z"
back = "S"
left = "Q"
right = "D"
up = "SPACE"
down = "LEFT_CONTROL, RIGHT_CONTROL"
toggle_hud = "F3"
menu = "ESCAPE"
# Les outils : 1 tuyau, 2 seau, 3 crue, 4 gomme (la rangée des chiffres).
tool_1 = "1"
tool_2 = "2"
tool_3 = "3"
tool_4 = "4"
tool_5 = "5"
tool_6 = "6"
tool_7 = "7"
tool_8 = "8"
tool_9 = "9"
# Le temps. LEFT_BRACKET et RIGHT_BRACKET sont les deux touches à droite du P
# (^ et $ sur AZERTY), PERIOD celle à droite du ; (: sur AZERTY). Le HUD les affiche
# telles qu'elles sont imprimées sur ton clavier.
pause = "P"
slower = "LEFT_BRACKET"
faster = "RIGHT_BRACKET"
step = "PERIOD"
save_checkpoint = "F5"
load_checkpoint = "F9"
