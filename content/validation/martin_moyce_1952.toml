width_m = 0.05715
front_dimensionless = [1.11, 1.22, 1.44, 1.67, 1.89, 2.11, 2.33, 2.56, 2.78, 3.00, 3.22, 3.44, 3.67, 3.89, 4.11, 5.00, 5.89, 7.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 14.0]
