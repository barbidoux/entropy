[source]
experiment = "J. C. Martin and W. J. Moyce (1952). Part IV. An experimental study of the collapse of liquid columns on a rigid horizontal plane. Philosophical Transactions of the Royal Society A 244 (882), 312-324: release and clock pp. 313-314, Table 2 (surge front, n² = 2), Table 6 (onset of motion)."
data = "Means of the records in Table 2, read from a scan of the paper (math.ntu.edu.tw/~shyue/orch08/benchmarks/lowmach/broken-dam/91519.pdf) by ENTROPY's physics auditor, 2026-11-21. PySPH's digitisation of Figure 3 (pysph/examples/db_exp_data.py, mm_data_1 and mm_data_2) agrees within about 0.04 in T but reads about 2 % low in Z at T = 2.0-2.55, so the table is used instead."
