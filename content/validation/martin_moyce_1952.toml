# Dam break: surge front of a collapsing water column (V-LIQ-03, US-02).
# A column of width a and height 2a (n² = 2) on a dry, rigid horizontal floor, held by
# a waxed-paper diaphragm freed by an electric heater strip. Dimensionless: front
# position Z = z/a (z from the wall behind the column), time T = t·sqrt(2g/a).
#
# The time origin is a convention of the paper, not the moment the water was released:
# each record was rescaled so that T = 1.19 when Z = 1.44, which is about the time since
# the heater current was applied (p. 314 and Table 2's footnote). The first motion came
# up to T = 0.23 after the current (Table 6). See ADR 0019.
name = "Martin & Moyce (1952), surge front, n² = 2: means of the records in Table 2"
height_over_width = 2.0
clock_point = [1.44, 1.19]  # (Z, T) where the paper fixed every record's clock

