name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    name: CPU suite, lint and types
    runs-on: ubuntu-latest
    env:
      # Mesa's software renderer offers OpenGL 4.5, not the game's 4.6 (ADR 0009).
      ENTROPY_TEST_GL_VERSION: "4.5"
    steps:
      # Exact versions on node24 (Node.js 20 is deprecated on runners, #42). setup-uv no
      # longer moves its major tags (v8), so the version is pinned exactly.
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Software OpenGL for render tests (Mesa llvmpipe, SPEC 9.2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: OpenGL available to the tests
        run: >-
          xvfb-run -a uv run python -c "from entropy.core.config import WindowSettings;
          from entropy.render.context import GameWindow;
          w = GameWindow(WindowSettings(gl_version=(4, 5)), visible=False); i = w.ctx.info;
          print(i['GL_VERSION'], '|', i['GL_RENDERER']); w.close()"
      - name: Tests
        run: xvfb-run -a uv run coverage run -m pytest
      - name: Coverage (SPEC 9.3, at least 90 %)
        run: uv run coverage report
