[project]
name = "entropy"
version = "0.0.1"
description = "Real-time physics sandbox: water, fire, smoke, explosions and destruction that obey physical laws."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "glfw>=2.11.0",
    "imgui-bundle>=1.93.0",
    "moderngl>=5.13.0",
    "numpy>=2.0",
    "warp-lang>=1.19",
]

[project.scripts]
entropy = "entropy.app.main:main"
entropy-shortcut = "entropy.app.shortcut:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p pytester -m 'not gpu and not perf and not soak'"
markers = [
    "gpu: needs a CUDA device (run on the laptop with -m gpu)",
    "perf: performance benchmark against SPEC section 3 budgets (GPU only)",
    "soak: long-running stability test (GPU only)",
    "slow: takes more than 1 s on CPU",
    "render: needs an OpenGL context",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ICN"]

[tool.ruff.lint.flake8-import-conventions]
# `import warp as wp` everywhere: the coverage exclusion of kernels relies on `@wp.`.
banned-from = ["warp"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
warp = "wp"

[tool.pyright]
include = ["src", "tests", "bench"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Warp kernels declare arguments as `wp.array(dtype=float)`: a call in a type
# position, which is Warp's documented syntax but not valid typing. Only this
# rule is relaxed; every other check stays on.
reportInvalidTypeForm = false

[tool.coverage.run]
source = ["entropy"]
branch = true

[tool.coverage.report]
# SPEC 9.3: at least 90 % of Python orchestration lines. Branch coverage is on, so the
# floor applies to lines and branches together, which is stricter. Warp kernels and
# functions are compiled, so line coverage cannot see inside them; each kernel module
# has its own behavioural tests instead.
fail_under = 90
show_missing = true
exclude_also = ["@wp\\.kernel", "@wp\\.func"]
