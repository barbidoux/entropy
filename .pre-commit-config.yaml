repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest-fast
        name: fast CPU tests
        entry: uv run pytest -q -m "not gpu and not perf and not soak and not slow"
        language: system
        pass_filenames: false
        always_run: true
